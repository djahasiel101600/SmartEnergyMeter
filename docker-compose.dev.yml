services:

  # ── Backend: Django dev server with hot reload ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Override entrypoint for dev — skip collectstatic, use runserver
    entrypoint: []
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      # Mount source for live reload
      - ./backend:/app
    environment:
      DEBUG: "True"
      CORS_ALLOW_ALL_ORIGINS: "True"
    ports:
      - "8000:8000"

  # ── Frontend: Vite dev server with HMR ────────────────────────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    entrypoint: []
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # anonymous volume so host node_modules don't shadow
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_WS_URL: ws://localhost:8000/ws/energy/
    depends_on:
      - backend
